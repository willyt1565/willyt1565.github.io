<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 540" role="img" aria-hidden="true" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#1E3A8A" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <linearGradient id="rise" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#0EA5E9"/>
      <stop offset="1" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="house" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E3A8A"/>
      <stop offset="1" stop-color="#162B65"/>
    </linearGradient>
    <radialGradient id="dawn" cx="0.5" cy="1" r="0.75">
      <stop offset="0" stop-color="#CDA434" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#CDA434" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="card"><rect width="480" height="540" rx="22"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="480" height="540" fill="#F8FAFC"/>
    <rect width="480" height="540" fill="url(#grid)"/>

    <!-- Dawn of a new era: rising sun behind the horizon -->
    <circle cx="368" cy="300" r="150" fill="url(#dawn)"/>
    <circle cx="368" cy="300" r="58" fill="#CDA434" fill-opacity="0.9"/>
    <g stroke="#CDA434" stroke-width="3" stroke-linecap="round" stroke-opacity="0.7">
      <path d="M368 216v-22M310 242l-15-15M426 242l15-15M284 300h-22M452 300h22"/>
    </g>
    <rect x="0" y="300" width="480" height="240" fill="#F8FAFC"/>
    <rect x="0" y="300" width="480" height="240" fill="url(#grid)"/>
    <path d="M24 300H456" stroke="#1E3A8A" stroke-opacity="0.25" stroke-width="2"/>

    <!-- Where it started: a blueprint sketch, unfinished, with measurement marks -->
    <g fill="none" stroke="#0EA5E9" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M52 470V392L120 338L188 392V470" stroke-dasharray="7 7"/>
      <path d="M52 470H188" stroke-dasharray="7 7"/>
      <rect x="104" y="420" width="32" height="50" stroke-dasharray="5 6"/>
      <rect x="68" y="404" width="24" height="22" stroke-dasharray="4 5"/>
      <path d="M52 492H188M52 486v12M188 486v12" stroke-opacity="0.6" stroke-width="1.5"/>
      <path d="M36 470V392M30 470h12M30 392h12" stroke-opacity="0.6" stroke-width="1.5"/>
    </g>

    <!-- Today: a finished, well-kept rental standing on solid ground -->
    <g>
      <path d="M212 476V376L296 310L380 376V476Z" fill="url(#house)"/>
      <path d="M200 382L296 302L392 382" fill="none" stroke="#0EA5E9" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="276" y="414" width="40" height="62" rx="3" fill="#F8FAFC" fill-opacity="0.95"/>
      <circle cx="306" cy="446" r="2.6" fill="#1E3A8A"/>
      <rect x="230" y="396" width="30" height="28" rx="3" fill="#CDA434"/>
      <rect x="332" y="396" width="30" height="28" rx="3" fill="#CDA434"/>
      <path d="M245 396v28M230 410h30M347 396v28M332 410h30" stroke="#162B65" stroke-width="2"/>
      <rect x="196" y="476" width="200" height="10" rx="5" fill="#1E3A8A" fill-opacity="0.85"/>
    </g>

    <!-- The investor's line: from the sketch, through the home, rising toward long-term wealth -->
    <path d="M120 338C170 330 220 322 296 302C350 288 392 230 430 150"
          fill="none" stroke="url(#rise)" stroke-width="5" stroke-linecap="round" stroke-dasharray="0"/>
    <path d="M412 156L432 146L436 168" fill="none" stroke="#1E3A8A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="120" cy="338" r="9" fill="#F8FAFC" stroke="#0EA5E9" stroke-width="4"/>
    <circle cx="296" cy="302" r="9" fill="#F8FAFC" stroke="#1E3A8A" stroke-width="4"/>

    <!-- Small growth bars: an asset that keeps building value -->
    <g fill="#1E3A8A">
      <rect x="64" y="96" width="18" height="40" rx="4" fill-opacity="0.25"/>
      <rect x="92" y="78" width="18" height="58" rx="4" fill-opacity="0.45"/>
      <rect x="120" y="56" width="18" height="80" rx="4" fill-opacity="0.7"/>
      <rect x="148" y="34" width="18" height="102" rx="4" fill="#0EA5E9"/>
    </g>
    <path d="M56 146H176" stroke="#1E3A8A" stroke-opacity="0.3" stroke-width="2" stroke-linecap="round"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
